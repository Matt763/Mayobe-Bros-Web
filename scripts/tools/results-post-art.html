<!doctype html>
<!-- Draws the nine cover pictures of the NECTA results posts (assets/posts/necta-<exam>-results-<year>.webp).
     Open it through a small local server (a browser blocks the logo file on file://), for example
       python3 -m http.server 8011 --bind 127.0.0.1 --directory scripts/tools
     then http://127.0.0.1:8011/results-post-art.html?scene=csee-2025   (?scene=list shows every name, ?scene=sheet shows all nine small).
     Photo covers: ?scene=csee-2010&photo=file.jpg&layout=split-left|split-right|arch|frame|top-band|diagonal|circle|bottom-band|centre-band&tone=navy|emerald|burgundy|charcoal|plum|forest&fx=50&fy=50 (see the photo block below).
     Nine scenes, each with its own style: csee-2025 / 2024 / 2023, acsee-2025 / 2024 / 2023, psle-2025 / 2024 / 2023.
     Every scene has the same three ingredients and nothing else is a photograph or a copy:
       - the NECTA logo (scripts/tools/necta-logo.png, NECTA's own file from necta.go.tz, enlarged), shown only to say whose results the post is about,
       - the flag of Tanzania, drawn here from its published geometry (72 x 48, green and blue triangles, black band with yellow edges) and
         made to wave: the flag is cut into thin strips and every strip is moved and shaded along a travelling wave,
       - the exam name, the level and the year, written in text.
     Render each scene at 1400 x 788 (viewport screenshot) and convert with cwebp (see docs/image-sources.md). Nothing is requested from the network. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Results post art</title>
<style>html,body{margin:0;background:#111}svg{display:block;width:1400px;height:788px}#sheet svg{width:466px;height:262px;display:inline-block;margin:0}#sheet{width:1400px;line-height:0}</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ---------- helpers ---------- */
var W = 1400, H = 788, LOGO = 'necta-logo.png';
var EXAMS = {
  csee:  { abbr: 'CSEE',  level: 'FORM FOUR',      full: 'CERTIFICATE OF SECONDARY EDUCATION EXAMINATION' },
  acsee: { abbr: 'ACSEE', level: 'FORM SIX',       full: 'ADVANCED CERTIFICATE OF SECONDARY EDUCATION EXAMINATION' },
  psle:  { abbr: 'PSLE',  level: 'STANDARD SEVEN', full: 'PRIMARY SCHOOL LEAVING EXAMINATION' },
  ftna: { abbr: 'FTNA', level: 'FORM TWO', full: 'FORM TWO NATIONAL ASSESSMENT' },
  sfna: { abbr: 'SFNA', level: 'STANDARD FOUR', full: 'STANDARD FOUR NATIONAL ASSESSMENT' },
  dsee: { abbr: 'DSEE', level: 'DIPLOMA', full: 'DIPLOMA IN SECONDARY EDUCATION EXAMINATION' },
  dpee: { abbr: 'DPEE', level: 'DIPLOMA', full: 'TEACHERS COLLEGE DIPLOMA EXAMINATION' },
  dppee: { abbr: 'DPPEE', level: 'DIPLOMA', full: 'TEACHERS COLLEGE DIPLOMA EXAMINATION' },
  dspee: { abbr: 'DSPEE', level: 'DIPLOMA', full: 'TEACHERS COLLEGE DIPLOMA EXAMINATION' },
  dte: { abbr: 'DTE', level: 'DIPLOMA', full: 'DIPLOMA IN TECHNICAL EDUCATION EXAMINATION' },
  qt: { abbr: 'QT', level: 'QUALIFYING TEST', full: 'QUALIFYING TEST' }
};
var NAMES = ['csee-2025', 'csee-2024', 'csee-2023', 'acsee-2025', 'acsee-2024', 'acsee-2023', 'psle-2025', 'psle-2024', 'psle-2023'];
var ORG = 'NATIONAL EXAMINATIONS COUNCIL OF TANZANIA';
var FOOT = 'mayobebros.com  ·  An independent guide, not run by NECTA';
var E, Y;
function f(n) { return Math.round(n * 10) / 10; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
var ctx = document.createElement('canvas').getContext('2d');
function measure(str, fam, wt, style) { ctx.font = (style || 'normal') + ' ' + wt + ' 100px ' + fam; return ctx.measureText(str).width / 100; }
/* the font size that makes `str` exactly `width` wide (sp = letter spacing in em) */
function fit(str, fam, wt, width, sp, style) { return width / (measure(str, fam, wt, style) + str.length * (sp || 0)); }
function T(x, y, str, o) {
  return '<text x="' + f(x) + '" y="' + f(y) + '" font-family="' + o.fam + '" font-weight="' + (o.wt || 700) + '" font-size="' + f(o.size) + '" fill="' + (o.fill || '#fff') + '"' +
    (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') + (o.sp ? ' letter-spacing="' + f(o.sp * o.size) + '"' : '') + (o.style ? ' font-style="' + o.style + '"' : '') + (o.extra ? ' ' + o.extra : '') + '>' + esc(str) + '</text>';
}
function foot(x, y, fill, anchor, fam, size) { return T(x, y, FOOT, { fam: fam || 'Lato, sans-serif', wt: 600, size: size || 15, fill: fill, anchor: anchor || 'start', sp: 0.03 }); }
function rnd(seed) { var s = seed; return function () { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; }
/* the NECTA logo on a white disc */
function badge(cx, cy, r, ring, ringW, extra) {
  return '<g ' + (extra || '') + '><circle cx="' + f(cx) + '" cy="' + f(cy) + '" r="' + f(r) + '" fill="#fff"' + (ring ? ' stroke="' + ring + '" stroke-width="' + ringW + '"' : '') + '/>' +
    '<image href="' + LOGO + '" x="' + f(cx - r * 0.9) + '" y="' + f(cy - r * 0.9) + '" width="' + f(r * 1.8) + '" height="' + f(r * 1.8) + '"/></g>';
}
/* the flag of Tanzania, flying. It is drawn flat (72 x 48 units, the published geometry), cut into thin strips, and every strip is placed on a
   travelling wave: moved along the curve, sheared to follow its slope, and shaded (darker where the cloth turns away, lighter where it turns to the
   light). It is painted on a canvas (one bitmap per strip, so no seams show between strips) and placed in the picture as an <image>. */
function flatFlag(fw, fh, k) {
  var c = document.createElement('canvas'), g;
  c.width = Math.ceil(fw * k); c.height = Math.ceil(fh * k);
  g = c.getContext('2d'); g.scale(c.width / 72, c.height / 48);
  g.fillStyle = '#1EB53A'; g.beginPath(); g.moveTo(0, 48); g.lineTo(0, 0); g.lineTo(72, 0); g.closePath(); g.fill();
  g.fillStyle = '#00A3DD'; g.beginPath(); g.moveTo(72, 0); g.lineTo(72, 48); g.lineTo(0, 48); g.closePath(); g.fill();
  g.beginPath(); g.rect(0, 0, 72, 48); g.clip();
  g.lineCap = 'butt'; g.strokeStyle = '#FCD116'; g.lineWidth = 19; g.beginPath(); g.moveTo(0, 48); g.lineTo(72, 0); g.stroke();
  g.strokeStyle = '#000'; g.lineWidth = 13; g.beginPath(); g.moveTo(0, 48); g.lineTo(72, 0); g.stroke();
  return c;
}
function waveFlag(o) {
  var id = o.id || 'wf', fw = o.w, fh = fw * 2 / 3, k = 2, i;
  var amp = o.amp == null ? 0.42 : o.amp, waves = o.waves || 1.6, ph = o.phase || 0, flat = flatFlag(fw, fh, k);
  var SP = 4, n = Math.floor(flat.width / SP), sw = flat.width / n / k, ov = 1 / k; // every strip is SP whole source pixels wide (+1 pixel of overlap)
  var st = [], px = 0, py = 0, minY = 0, maxY = fh, maxX = 0;
  for (i = 0; i < n; i++) {
    var t = (i + 0.5) / n, th = amp * (0.12 + 0.88 * t) * Math.cos(2 * Math.PI * waves * t + ph), c = Math.cos(th), sn = Math.sin(th);
    st.push({ px: px, py: py, c: c, s: sn });
    px += sw * c; py += sw * sn; minY = Math.min(minY, py, st[i].py); maxY = Math.max(maxY, py + fh, st[i].py + fh); maxX = Math.max(maxX, px);
  }
  var pad = 14, cw = Math.ceil((maxX + 2 * pad) * k), ch = Math.ceil((maxY - minY + 2 * pad) * k), cv = document.createElement('canvas'), g;
  cv.width = cw; cv.height = ch; g = cv.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.scale(k, k); g.translate(pad, pad - minY);
  for (i = 0; i < n; i++) {
    var q = st[i];
    g.save(); g.transform(q.c, q.s, 0, 1, q.px, q.py);
    var sx = i * SP, sWd = Math.min(SP + 1, flat.width - sx);
    g.drawImage(flat, sx, 0, sWd, flat.height, 0, 0, sWd / k, fh);
    g.fillStyle = q.s > 0 ? 'rgba(0,0,0,' + Math.min(0.34, q.s * 0.75).toFixed(3) + ')' : 'rgba(255,255,255,' + Math.min(0.17, -q.s * 0.4).toFixed(3) + ')';
    g.fillRect(0, 0, sWd / k, fh);
    g.restore();
  }
  var ix = o.x - pad, iy = o.y - (pad - minY) ;
  var defs = '<defs><filter id="' + id + 'sh" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="' + f(fh * 0.03) + '" dy="' + f(fh * 0.07) + '" stdDeviation="' + f(fh * 0.05) + '" flood-color="' + (o.shadowColor || '#000') + '" flood-opacity="' + (o.shadow == null ? 0.4 : o.shadow) + '"/></filter>' +
    '<linearGradient id="' + id + 'pole" x1="0" x2="1"><stop offset="0" stop-color="#7d8590"/><stop offset=".4" stop-color="#f4f6f8"/><stop offset="1" stop-color="#6b727c"/></linearGradient>' +
    '<radialGradient id="' + id + 'ball" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f2b705"/><stop offset="1" stop-color="#9a6a00"/></radialGradient></defs>';
  var poleX = o.x - 9, pt = o.poleTop == null ? o.y - 40 : o.poleTop, pb = o.poleBottom == null ? o.y + fh + 120 : o.poleBottom;
  var pole = '<rect x="' + f(poleX) + '" y="' + f(pt) + '" width="11" height="' + f(pb - pt) + '" rx="5" fill="url(#' + id + 'pole)"/>' +
    '<circle cx="' + f(poleX + 5.5) + '" cy="' + f(pt - 3) + '" r="12" fill="url(#' + id + 'ball)"/>';
  var flag = '<image href="' + cv.toDataURL('image/png') + '" x="' + f(ix) + '" y="' + f(iy) + '" width="' + f(cw / k) + '" height="' + f(ch / k) + '" filter="url(#' + id + 'sh)"' + (o.rot ? ' transform="rotate(' + o.rot + ' ' + o.x + ' ' + o.y + ')"' : '') + '/>';
  return defs + flag + pole;
}
function svg(inner) { return '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 788" width="1400" height="788">' + inner + '</svg>'; }
function hill(base, amp, freq, ph, fill, extra) {
  var d = 'M0 788V' + f(base), x;
  for (x = 0; x <= 1400; x += 14) d += 'L' + x + ' ' + f(base - amp * (0.55 * Math.sin(x * freq + ph) + 0.45 * Math.sin(x * freq * 2.3 + ph * 1.7)));
  return '<path d="' + d + 'V788Z" fill="' + fill + '"' + (extra ? ' ' + extra : '') + '/>';
}

var SCENES = {};

/* ================= CSEE 2025: aurora glass (navy and teal, glass panel left, flag right) ================= */
SCENES['csee-2025'] = function () {
  var F = 'Noto Sans, Lato, sans-serif', s = Math.min(fit('NECTA CSEE', F, 800, 590, 0), fit('RESULTS', F, 800, 590, 0));
  var o = '<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050f2b"/><stop offset=".55" stop-color="#093350"/><stop offset="1" stop-color="#0c6a6c"/></linearGradient>' +
    '<radialGradient id="g1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".6"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="g2"><stop offset="0" stop-color="#3b82f6" stop-opacity=".55"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>' +
    '<linearGradient id="yr" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>' +
    '<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>' +
    '<pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern></defs>' +
    '<rect width="1400" height="788" fill="url(#bg)"/><rect width="1400" height="788" fill="url(#grid)"/>' +
    '<circle cx="1110" cy="300" r="480" fill="url(#g1)"/><circle cx="220" cy="720" r="430" fill="url(#g2)"/>' +
    '<circle cx="1110" cy="330" r="260" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/><circle cx="1110" cy="330" r="360" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="2"/><circle cx="1110" cy="330" r="470" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="2"/>';
  o += waveFlag({ id: 'a', x: 925, y: 150, w: 420, amp: 0.4, waves: 1.5, phase: 0.2, poleTop: 96, poleBottom: 700 });
  // floating grade chips
  [['A', 1010, 590, 62], ['B', 1130, 640, 50], ['C', 1235, 585, 44]].forEach(function (c, i) {
    o += '<g><rect x="' + (c[1] - c[3] / 2 * 1.0) + '" y="' + (c[2] - c[3] / 2) + '" width="' + c[3] + '" height="' + c[3] + '" rx="' + c[3] * 0.28 + '" fill="url(#glass)" stroke="#fff" stroke-opacity=".28"/>' +
      T(c[1] + c[3] / 2 - c[3] / 2, c[2] + c[3] * 0.18, c[0], { fam: F, wt: 800, size: c[3] * 0.56, fill: '#a7f3d0', anchor: 'middle' }) + '</g>';
  });
  o += '<rect x="64" y="96" width="700" height="590" rx="38" fill="url(#glass)" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>' +
    '<path d="M100 97.5H728" stroke="#fff" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>';
  o += badge(172, 196, 48, '#5eead4', 3) +
    T(238, 190, 'NATIONAL EXAMINATIONS', { fam: F, wt: 700, size: 18, fill: '#a7f3d0', sp: 0.12 }) + T(238, 216, 'COUNCIL OF TANZANIA', { fam: F, wt: 700, size: 18, fill: '#a7f3d0', sp: 0.12 });
  o += '<rect x="112" y="272" width="212" height="40" rx="20" fill="#2dd4bf"/>' + T(218, 299, E.level + '  ·  ' + E.abbr, { fam: F, wt: 800, size: 17, fill: '#042f2e', anchor: 'middle', sp: 0.08 });
  o += T(112, 410, 'NECTA CSEE', { fam: F, wt: 800, size: s, fill: '#fff' }) + T(112, 410 + s * 1.02, 'RESULTS', { fam: F, wt: 800, size: s, fill: '#fff' });
  o += T(108, 650, Y, { fam: F, wt: 800, size: 150, fill: 'url(#yr)' });
  o += foot(64, 738, '#9fd8d3', 'start', F);
  return o;
};

/* ================= CSEE 2024: editorial poster (cream paper, black rule, serif, coral panel) ================= */
SCENES['csee-2024'] = function () {
  var F = "'DejaVu Serif', Georgia, serif", C = '#e4572e', s1 = fit('NECTA CSEE', F, 700, 790), s2 = fit('RESULTS', F, 700, 790);
  var o = '<defs><filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .07 0"/></filter>' +
    '<linearGradient id="cor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0643a"/><stop offset="1" stop-color="#c9391a"/></linearGradient></defs>' +
    '<rect width="1400" height="788" fill="#f4eee1"/><rect width="1400" height="788" filter="url(#paper)"/>' +
    '<path d="M985 0H1400V788H905Z" fill="url(#cor)"/>' +
    '<path d="M985 0L905 788" stroke="#111" stroke-width="8"/>';
  o += waveFlag({ id: 'b', x: 1030, y: 138, w: 300, amp: 0.36, waves: 1.3, phase: 1.0, poleTop: 90, poleBottom: 520, shadow: 0.45 });
  o += badge(1170, 640, 70, '#111', 6) + T(1170, 746, 'RESULTS ' + Y, { fam: 'Liberation Sans Narrow, sans-serif', wt: 700, size: 20, fill: '#fff', anchor: 'middle', sp: 0.14 });
  o += '<rect x="70" y="86" width="790" height="12" fill="#111"/>' +
    T(70, 66, ORG, { fam: 'Liberation Sans Narrow, sans-serif', wt: 700, size: 19, fill: '#111', sp: 0.16 });
  o += T(66, 98 + s1 * 0.8, 'NECTA CSEE', { fam: F, wt: 700, size: s1, fill: '#111' }) + T(66, 98 + s1 * 0.8 + s2 * 0.95, 'RESULTS', { fam: F, wt: 700, size: s2, fill: C });
  var yb = 98 + s1 * 0.8 + s2 * 0.95;
  o += '<rect x="70" y="' + f(yb + 34) + '" width="790" height="4" fill="#111"/>' +
    T(70, yb + 84, E.level + ' EXAMINATION', { fam: 'Liberation Sans Narrow, sans-serif', wt: 700, size: 26, fill: '#111', sp: 0.2 }) +
    T(60, 712, Y, { fam: F, wt: 700, size: fit(Y, F, 700, 800), fill: '#111' });
  o += foot(70, 758, '#5a5347', 'start', 'Liberation Sans Narrow, sans-serif', 16);
  return o;
};

/* ================= CSEE 2023: blueprint (cobalt, drawing grid, mono type, flag in a dimensioned frame) ================= */
SCENES['csee-2023'] = function () {
  var F = "'DejaVu Sans Mono', monospace", s = fit('NECTA CSEE', F, 700, 650);
  var o = '<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2154d4"/><stop offset="1" stop-color="#14297a"/></linearGradient>' +
    '<pattern id="g1" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".08"/></pattern>' +
    '<pattern id="g2" width="140" height="140" patternUnits="userSpaceOnUse"><path d="M140 0H0V140" fill="none" stroke="#fff" stroke-opacity=".2"/></pattern></defs>' +
    '<rect width="1400" height="788" fill="url(#bg)"/><rect width="1400" height="788" fill="url(#g1)"/><rect width="1400" height="788" fill="url(#g2)"/>' +
    '<rect x="34" y="34" width="1332" height="720" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/><rect x="46" y="46" width="1308" height="696" fill="none" stroke="#fff" stroke-opacity=".3"/>' +
    '<circle cx="1040" cy="380" r="330" fill="none" stroke="#fff" stroke-opacity=".16" stroke-dasharray="4 10"/><circle cx="1040" cy="380" r="240" fill="none" stroke="#fff" stroke-opacity=".12"/>' +
    '<rect x="840" y="140" width="420" height="440" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="12 8"/>';
  [[840, 140], [1260, 140], [840, 580], [1260, 580]].forEach(function (p) { o += '<path d="M' + (p[0] - 14) + ' ' + p[1] + 'H' + (p[0] + 14) + 'M' + p[0] + ' ' + (p[1] - 14) + 'V' + (p[1] + 14) + '" stroke="#fde047" stroke-width="3"/>'; });
  o += waveFlag({ id: 'c', x: 912, y: 232, w: 300, amp: 0.34, waves: 1.4, phase: 0.6, poleTop: 176, poleBottom: 540, shadow: 0.35 });
  // dimension line under the frame
  o += '<path d="M840 612H1260M840 600V624M1260 600V624" stroke="#bfdbfe" stroke-width="2"/>' + T(1050, 646, 'FLAG  3 : 2', { fam: F, wt: 700, size: 18, fill: '#bfdbfe', anchor: 'middle', sp: 0.1 });
  o += T(90, 132, ORG, { fam: F, wt: 700, size: 15, fill: '#bfdbfe', sp: 0.06 });
  o += T(86, 270, 'NECTA CSEE', { fam: F, wt: 700, size: s, fill: '#fff' }) + T(86, 270 + s * 1.05, 'RESULTS', { fam: F, wt: 700, size: s, fill: '#fff' });
  o += '<rect x="90" y="' + f(270 + s * 1.05 + 36) + '" width="300" height="104" fill="#fde047"/>' + T(240, 270 + s * 1.05 + 36 + 82, Y, { fam: F, wt: 700, size: 96, fill: '#14297a', anchor: 'middle' });
  o += T(420, 270 + s * 1.05 + 84, E.level, { fam: F, wt: 700, size: 30, fill: '#fff', sp: 0.08 }) + T(420, 270 + s * 1.05 + 120, 'CERTIFICATE OF SECONDARY', { fam: F, wt: 400, size: 16, fill: '#bfdbfe' }) + T(420, 270 + s * 1.05 + 142, 'EDUCATION EXAMINATION', { fam: F, wt: 400, size: 16, fill: '#bfdbfe' });
  o += badge(160, 646, 58, '#fff', 3, '') + '<circle cx="160" cy="646" r="72" fill="none" stroke="#fff" stroke-opacity=".7" stroke-dasharray="6 7" stroke-width="2"/>';
  o += foot(250, 652, '#bfdbfe', 'start', F, 15);
  return o;
};

/* ================= ACSEE 2025: royal sunburst (deep purple, gold, serif, centred text, flag on the left) ================= */
SCENES['acsee-2025'] = function () {
  var F = "'Liberation Serif', 'DejaVu Serif', serif", cx = 915, s = Math.min(fit('NECTA ACSEE', F, 700, 660), 118);
  var o = '<defs><radialGradient id="bg" cx=".6" cy="1.0" r="1.2"><stop offset="0" stop-color="#6d28d9"/><stop offset=".5" stop-color="#2e1065"/><stop offset="1" stop-color="#0f0a2e"/></radialGradient>' +
    '<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".5" stop-color="#e9b949"/><stop offset="1" stop-color="#b8821f"/></linearGradient></defs>' +
    '<rect width="1400" height="788" fill="url(#bg)"/>';
  for (var k = 0; k < 28; k++) {
    var a1 = Math.PI * (1.0 + k / 27 * 1.0) - 0.03, a2 = a1 + 0.06, R = 1900, ox = 860, oy = 860;
    o += '<path d="M' + ox + ' ' + oy + 'L' + f(ox + R * Math.cos(a1)) + ' ' + f(oy + R * Math.sin(a1)) + 'L' + f(ox + R * Math.cos(a2)) + ' ' + f(oy + R * Math.sin(a2)) + 'Z" fill="#f5d27a" fill-opacity="' + (k % 2 ? 0.07 : 0.03) + '"/>';
  }
  o += '<rect x="34" y="34" width="1332" height="720" rx="10" fill="none" stroke="#e9b949" stroke-opacity=".8" stroke-width="2.5"/><rect x="48" y="48" width="1304" height="692" rx="6" fill="none" stroke="#e9b949" stroke-opacity=".35" stroke-width="1.2"/>';

  } else if (comp === 'diagonal') {

/* explicit &palette= / &layout= win (any name from LUXE / LAYOUTS); without them the choice follows the exam and the year among the FIRST SIX palettes and
   FIRST THREE layouts only (so addresses without parameters keep drawing what they always drew) */
function pick(name, key, list, base) { var p = new URLSearchParams(location.search).get(key); if (p && list.indexOf(p) >= 0) return p; var q = name.split('-'), h = (q[1] | 0) + ['csee', 'acsee', 'psle'].indexOf(q[0]) * 2 + (key === 'layout' ? 1 : 0); return base[h % base.length]; }

/* ---------- page ---------- */
function build(name, pal, lay, uid) {
  var p = name.split('-'); E = EXAMS[p[0]]; Y = p[1]; uid = uid || name;
  // ids are made unique per scene so that ?scene=sheet can show all nine on one page
  var inner = SCENES[name] ? SCENES[name]() : luxe(name, pal || pick(name, 'palette', LUXE_NAMES, LUXE_BASE), lay || pick(name, 'layout', LAYOUTS, LAYOUTS_BASE));
  return svg(inner).replace(/ id="([^"]+)"/g, ' id="' + uid + '-$1"').replace(/url\(#/g, 'url(#' + uid + '-').replace(/href="#/g, 'href="#' + uid + '-');
}
var QS = new URLSearchParams(location.search), q = QS.get('scene') || 'csee-2025', stage = document.getElementById('stage');
if (q === 'list') stage.textContent = NAMES.join('\n');
else if (q === 'luxe-list') stage.textContent = 'palettes: ' + LUXE_NAMES.join(', ') + '   layouts: ' + LAYOUTS.join(', ');
else if (q === 'sheet') { stage.id = 'sheet'; stage.innerHTML = NAMES.map(function (n) { return build(n); }).join(''); }
else if (q === 'luxe-sheet') {
  /* a contact sheet for choosing and checking, never part of a cover:
       ?scene=luxe-sheet&sample=csee-2010&layout=gala            every palette in one layout
       ?scene=luxe-sheet&sample=csee-2010&palette=teal-pearl     every layout in one palette
       ?scene=luxe-sheet&list=csee-2019:sienna-sand:masthead,acsee-2018:olive-bronze:gala   exactly these covers (scene:palette:layout, comma-separated)
     &cols=3 and &w=460 set the columns and the tile width in pixels */
  var items = [], cols = +QS.get('cols') || 3, tw = +QS.get('w') || 460, sample = QS.get('sample') || 'csee-2010';
  if (QS.get('list')) QS.get('list').split(',').forEach(function (t) { var a = t.split(':'); items.push({ scene: a[0], pal: a[1], lay: a[2] }); });
  else (QS.get('palette') ? [QS.get('palette')] : LUXE_NAMES).forEach(function (pn) { (QS.get('layout') ? [QS.get('layout')] : LAYOUTS).forEach(function (ln) { items.push({ scene: sample, pal: pn, lay: ln }); }); });
  stage.id = 'lsheet';
  stage.innerHTML = '<style>#lsheet{width:' + (cols * (tw + 12)) + 'px;display:flex;flex-wrap:wrap;line-height:1.2}#lsheet figure{margin:0 6px 6px;width:' + tw + 'px}#lsheet svg{width:' + tw + 'px;height:' + Math.round(tw * 788 / 1400) + 'px}#lsheet figcaption{font:12px/16px sans-serif;color:#ccc;padding:2px 0}</style>' +
    items.map(function (it, n) { return '<figure>' + build(it.scene, it.pal, it.lay, 's' + n) + '<figcaption>' + esc(it.scene + '  ' + it.pal + '  ' + it.lay) + '</figcaption></figure>'; }).join('');
}

  E = EXAMS[pp[0]]; Y = pp[1];
  im.onload = function () { var fx = QS.get('fx') == null ? 50 : +QS.get('fx'), fy = QS.get('fy') == null ? 50 : +QS.get('fy'); stage.innerHTML = svg(photoCover(pf, PHOTO_LAYOUTS.indexOf(pl) < 0 ? 'split-left' : pl, TONES[pt] ? pt : 'navy', fx, fy, im.naturalWidth, im.naturalHeight)); document.title = 'ready'; };
  im.onerror = function () { stage.textContent = 'photo not found: photos/' + pf; };
  im.src = 'photos/' + pf;
}
else stage.innerHTML = build(q);
