<!doctype html>
<!-- Draws the hero pictures for the company, legal and trust pages (assets/img/heroes/*.webp).
     Open this file in a browser with ?scene=privacy-policy (or any scene name below) to see one, or ?scene=list for all names.
     To regenerate the WebP files: screenshot each scene at 1920x1080 and convert with cwebp (see docs/hero-art.md).
     Everything is drawn in code from the brand colours; there are no photographs and nothing is copied from anywhere. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero art</title>
<style>html,body{margin:0;background:#070b14}svg{display:block;width:1920px;height:1080px}</style>
</head>
<body>
<div id="stage"></div>
<script>
/* 24x24 line icons (stroke only) */
var I = {
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><path d="M12 15v3"/>',
  eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  scales: '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  check: '<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>',
  cookie: '<path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/><path d="M8.5 8.5v.01"/><path d="M16 15.5v.01"/><path d="M12 12v.01"/><path d="M11 17v.01"/><path d="M7 14v.01"/>',
  layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  searchCheck: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="m8 11 2 2 4-4"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8"/><path d="M8 13h5"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  briefcase: '<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  rss: '<path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/>',
  trending: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  graduation: '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
  phone: '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/><path d="M9 6h6"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>'
};

/* scene = which big glyph, the two accent colours, and the small cards around it */
var SCENES = {
  'privacy-policy':      { glyph: 'shield',  a: '#2f6bff', b: '#22d3ee', bg2: '#0e2a73', chips: ['lock', 'eye', 'key', 'user', 'check'] },
  'terms-of-service':    { glyph: 'scales',  a: '#4a63ff', b: '#a78bfa', bg2: '#17236b', chips: ['file', 'check', 'book', 'flag', 'shield'] },
  'cookie-policy':       { glyph: 'cookie',  a: '#2f6bff', b: '#f5b042', bg2: '#102a6b', chips: ['clock', 'shield', 'check', 'database', 'eye'] },
  'cache-policy':        { glyph: 'layers',  a: '#2f6bff', b: '#2dd4bf', bg2: '#0c2c6a', chips: ['database', 'zap', 'clock', 'globe', 'check'] },
  'editorial-policy':    { glyph: 'pen',     a: '#2f6bff', b: '#4ade80', bg2: '#0f2a70', chips: ['book', 'check', 'file', 'user', 'star'] },
  'fact-checking-policy':{ glyph: 'searchCheck', a: '#34d399', b: '#2f6bff', bg2: '#0b2d63', chips: ['link', 'check', 'book', 'clock', 'flag'] },
  'comment-policy':      { glyph: 'message', a: '#2f6bff', b: '#f472b6', bg2: '#15256f', chips: ['users', 'heart', 'check', 'flag', 'shield'] },
  'about':               { glyph: 'users',   a: '#4ade80', b: '#2f6bff', bg2: '#0b2d63', chips: ['heart', 'book', 'globe', 'star', 'pen'] },
  'contact':             { glyph: 'mail',    a: '#2f6bff', b: '#22d3ee', bg2: '#0e2a73', chips: ['message', 'clock', 'user', 'check', 'globe'] },
  'advertise':           { glyph: 'briefcase', a: '#2f6bff', b: '#f5b042', bg2: '#12276b', chips: ['trending', 'mail', 'users', 'star', 'check'] },
  'author':              { glyph: 'pen',     a: '#4ade80', b: '#2f6bff', bg2: '#0c2c6a', chips: ['user', 'book', 'star', 'file', 'rss'] },
  'cover-student-loans': { glyph: 'graduation', a: '#2f6bff', b: '#4ade80', bg2: '#0f2a70', chips: ['file', 'check', 'clock', 'link', 'user'] },
  'cover-foldable-phone':{ glyph: 'phone', a: '#4a63ff', b: '#a78bfa', bg2: '#17236b', chips: ['zap', 'clock', 'check', 'eye', 'flag'] },
  'search':              { glyph: 'search',  a: '#2f6bff', b: '#a78bfa', bg2: '#15256f', chips: ['book', 'file', 'trending', 'link', 'star'] }
};

function g(name, x, y, size, attrs) { // an icon placed at x,y (top left) with the given pixel size
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + (size / 24) + ')" fill="none" stroke-linecap="round" stroke-linejoin="round" ' + attrs + '>' + I[name] + '</g>';
}

function chip(name, cx, cy, w, h, c, rot, k) {
  var x = cx - w / 2, y = cy - h / 2, s = h * 0.44;
  return '<g transform="rotate(' + rot + ' ' + cx + ' ' + cy + ')" filter="url(#shadow)">' +
    '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (h * 0.26) + '" fill="url(#glass)" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>' +
    '<rect x="' + (x + h * 0.2) + '" y="' + (y + h * 0.2) + '" width="' + s * 1.5 + '" height="' + s * 1.5 + '" rx="' + (s * 0.45) + '" fill="' + c + '" opacity=".92"/>' +
    g(name, x + h * 0.2 + s * 0.25, y + h * 0.2 + s * 0.25, s, 'stroke="#fff" stroke-width="1.9"') +
    '<rect x="' + (x + h * 0.2 + s * 1.5 + h * 0.16) + '" y="' + (y + h * 0.3) + '" width="' + (w - h * 0.2 - s * 1.5 - h * 0.16 - h * 0.28) * (0.62 + 0.3 * ((k * 37) % 10) / 10) + '" height="' + h * 0.11 + '" rx="' + h * 0.055 + '" fill="#fff" opacity=".78"/>' +
    '<rect x="' + (x + h * 0.2 + s * 1.5 + h * 0.16) + '" y="' + (y + h * 0.5) + '" width="' + (w - h * 0.2 - s * 1.5 - h * 0.16 - h * 0.28) * 0.46 + '" height="' + h * 0.09 + '" rx="' + h * 0.045 + '" fill="#fff" opacity=".36"/>' +
    '</g>';
}

function draw(name) {
  var S = SCENES[name], cx = 960, cy = 540, out = [];
  out.push('<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">');
  out.push('<defs>' +
    '<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050913"/><stop offset=".55" stop-color="#0a1a45"/><stop offset="1" stop-color="' + S.bg2 + '"/></linearGradient>' +
    '<radialGradient id="blobA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="' + S.a + '" stop-opacity=".62"/><stop offset="1" stop-color="' + S.a + '" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="blobB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="' + S.b + '" stop-opacity=".5"/><stop offset="1" stop-color="' + S.b + '" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="' + S.a + '" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>' +
    '<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>' +
    '<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + S.a + '"/><stop offset="1" stop-color="' + S.b + '"/></linearGradient>' +
    '<pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff"/></pattern>' +
    '<radialGradient id="fade" cx=".5" cy=".5" r=".62"><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></radialGradient>' +
    '<mask id="dotmask"><rect width="1920" height="1080" fill="url(#fade)"/></mask>' +
    '<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>' +
    '<filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>' +
    '<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".42"/></filter>' +
    '</defs>');
  out.push('<rect width="1920" height="1080" fill="url(#bg)"/>');
  out.push('<ellipse cx="300" cy="170" rx="760" ry="620" fill="url(#blobA)"/>');
  out.push('<ellipse cx="1660" cy="930" rx="820" ry="640" fill="url(#blobB)"/>');
  out.push('<ellipse cx="1540" cy="120" rx="520" ry="380" fill="url(#blobB)" opacity=".5"/>');
  out.push('<rect width="1920" height="1080" fill="url(#dots)" opacity=".16" mask="url(#dotmask)"/>');
  out.push('<circle cx="' + cx + '" cy="' + cy + '" r="620" fill="url(#core)"/>');

  // concentric rings with a few dashed arcs and glowing nodes
  [210, 330, 470, 630, 810, 1010].forEach(function (r, i) {
    out.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#fff" stroke-opacity="' + (0.15 - i * 0.017).toFixed(3) + '" stroke-width="' + (i % 2 ? 1.5 : 2.5) + '"' + (i === 2 ? ' stroke-dasharray="3 16"' : '') + (i === 4 ? ' stroke-dasharray="90 24 8 24"' : '') + '/>');
  });
  out.push('<circle cx="' + cx + '" cy="' + cy + '" r="470" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="360 2594" transform="rotate(-38 ' + cx + ' ' + cy + ')" opacity=".9"/>');
  out.push('<circle cx="' + cx + '" cy="' + cy + '" r="810" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="520 4570" transform="rotate(118 ' + cx + ' ' + cy + ')" opacity=".75"/>');
  [[330, 205, S.b, 9], [470, 322, S.a, 11], [630, 14, S.b, 8], [810, 262, S.a, 10], [330, 28, S.a, 7], [1010, 205, S.b, 9]].forEach(function (n) {
    var a = n[1] * Math.PI / 180, x = cx + n[0] * Math.cos(a), y = cy + n[0] * Math.sin(a);
    out.push('<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + n[3] * 2.6 + '" fill="' + n[2] + '" opacity=".18"/><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + n[3] + '" fill="' + n[2] + '"/>');
  });

  // the big glyph in the middle: a glowing copy underneath, then the crisp line drawing
  var gs = 380, gx = cx - gs / 2, gy = cy - gs / 2;
  out.push('<g filter="url(#blur30)" opacity=".85">' + g(S.glyph, gx, gy, gs, 'stroke="' + S.a + '" stroke-width="1.6"') + '</g>');
  out.push(g(S.glyph, gx, gy, gs, 'stroke="#fff" stroke-opacity=".34" stroke-width="0.9"'));

  // small glass cards around it (two stay near the middle so tall phone crops still show some)
  var P = [[345, 250, 340, 118, -5], [1590, 300, 360, 124, 4], [270, 800, 350, 120, 3], [1650, 790, 340, 118, -4], [1010, 150, 250, 92, 2]];
  var cols = [S.a, S.b, S.b, S.a, S.a];
  S.chips.forEach(function (n, i) { var p = P[i]; out.push(chip(n, p[0], p[1], p[2], p[3], cols[i], p[4], i + 1)); });
  out.push(chip(S.glyph, 880, 960, 250, 92, S.b, -2, 7));

  // very fine grain: stops dark gradients from showing bands once the picture is compressed
  out.push('<rect width="1920" height="1080" filter="url(#grain)" opacity=".07" style="mix-blend-mode:overlay"/>');
  // fine light along the top edge
  out.push('<rect x="0" y="0" width="1920" height="2" fill="#fff" opacity=".18"/>');
  out.push('</svg>');
  return out.join('');
}

var q = new URLSearchParams(location.search).get('scene') || 'privacy-policy';
document.getElementById('stage').innerHTML = q === 'list' ? '<pre style="color:#fff;font:20px monospace">' + Object.keys(SCENES).join('\n') + '</pre>' : draw(q);
</script>
</body>
</html>
